name: Keep demo awake

# Render's free plan puts the API to sleep after ~15 minutes without traffic, and waking it
# takes up to a minute. Pinging it every 10 minutes keeps the hosted demo responsive.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10
          https://sentiment-pulse-api-f18c.onrender.com/health/live
