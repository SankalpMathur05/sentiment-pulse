name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    name: ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt && pip install -e ml
      - run: pytest ml/tests -q

  backend:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentiment
          POSTGRES_PASSWORD: sentiment
          POSTGRES_DB: sentiment_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentiment -d sentiment_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sentiment:sentiment@localhost:5432/sentiment_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt && pip install ./ml
      - run: pytest -q
        working-directory: backend

  frontend:
    name: Frontend lint, type-check, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ml, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
